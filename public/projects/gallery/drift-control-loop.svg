<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
 <rect width="800" height="500" fill="#070707"/>
 <rect x="40" y="40" width="720" height="420" rx="14" fill="#0f0f0f" stroke="#292524"/>

 <!-- timeline axis -->
 <line x1="100" y1="200" x2="700" y2="200" stroke="#44403c" stroke-width="2"/>

 <!-- 5ms period ticks -->
 <line x1="140" y1="190" x2="140" y2="210" stroke="#78716c"/>
 <line x1="280" y1="190" x2="280" y2="210" stroke="#78716c"/>
 <line x1="420" y1="190" x2="420" y2="210" stroke="#78716c"/>
 <line x1="560" y1="190" x2="560" y2="210" stroke="#78716c"/>
 <line x1="700" y1="190" x2="700" y2="210" stroke="#78716c"/>
 <text x="140" y="230" text-anchor="middle" fill="#78716c" font-family="ui-monospace, monospace" font-size="11">0</text>
 <text x="280" y="230" text-anchor="middle" fill="#78716c" font-family="ui-monospace, monospace" font-size="11">5ms</text>
 <text x="420" y="230" text-anchor="middle" fill="#78716c" font-family="ui-monospace, monospace" font-size="11">10ms</text>
 <text x="560" y="230" text-anchor="middle" fill="#78716c" font-family="ui-monospace, monospace" font-size="11">15ms</text>

 <!-- ISR blocks -->
 <rect x="140" y="120" width="60" height="70" rx="4" fill="#f59e0b" opacity="0.9"/>
 <rect x="280" y="120" width="58" height="70" rx="4" fill="#f59e0b" opacity="0.9"/>
 <rect x="420" y="120" width="62" height="70" rx="4" fill="#f59e0b" opacity="0.9"/>
 <rect x="560" y="120" width="55" height="70" rx="4" fill="#f59e0b" opacity="0.9"/>
 <text x="170" y="160" text-anchor="middle" fill="#1c1917" font-family="ui-monospace, monospace" font-size="10" font-weight="700">ISR</text>
 <text x="310" y="160" text-anchor="middle" fill="#1c1917" font-family="ui-monospace, monospace" font-size="10" font-weight="700">ISR</text>
 <text x="451" y="160" text-anchor="middle" fill="#1c1917" font-family="ui-monospace, monospace" font-size="10" font-weight="700">ISR</text>
 <text x="587" y="160" text-anchor="middle" fill="#1c1917" font-family="ui-monospace, monospace" font-size="10" font-weight="700">ISR</text>

 <!-- idle / main -->
 <rect x="205" y="145" width="70" height="20" rx="3" fill="#292524" stroke="#57534e"/>
 <rect x="345" y="145" width="70" height="20" rx="3" fill="#292524" stroke="#57534e"/>
 <rect x="490" y="145" width="65" height="20" rx="3" fill="#292524" stroke="#57534e"/>
 <text x="400" y="110" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="11">main: telemetry drain (best-effort)</text>

 <!-- budget callout -->
 <rect x="120" y="280" width="560" height="100" rx="10" fill="#1c1917" stroke="#44403c"/>
 <text x="400" y="315" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="14">budget 5.0 ms -> worst-case 2.1 ms -> headroom ~58%</text>
 <text x="400" y="345" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="12">sample -> filter -> cascade PID -> PWM update</text>
 <text x="400" y="365" text-anchor="middle" fill="#78716c" font-family="ui-monospace, monospace" font-size="11">no printf -> no heap -> no blocking SPI retry</text>

 <text x="60" y="430" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12" opacity="0.85">CONTROL LOOP   fixed 200 Hz ISR, telemetry off the critical path</text>
</svg>
