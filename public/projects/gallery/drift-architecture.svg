<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#070707"/>
  <rect x="40" y="40" width="720" height="420" rx="14" fill="#0f0f0f" stroke="#292524"/>

  <!-- boxes -->
  <rect x="70" y="100" width="120" height="56" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="125" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="13">IMU</text>
  <text x="130" y="143" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="11">SPI @ 200Hz</text>

  <rect x="240" y="100" width="140" height="56" rx="10" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
  <text x="310" y="125" text-anchor="middle" fill="#fdba74" font-family="ui-monospace, monospace" font-size="13">Estimator</text>
  <text x="310" y="143" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="11">complementary</text>

  <rect x="430" y="100" width="140" height="56" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="125" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="13">Cascade PID</text>
  <text x="500" y="143" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="11">rate � angle � pos</text>

  <rect x="620" y="100" width="110" height="56" rx="10" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
  <text x="675" y="125" text-anchor="middle" fill="#fdba74" font-family="ui-monospace, monospace" font-size="13">PWM</text>
  <text x="675" y="143" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="11">H-bridge</text>

  <!-- arrows top -->
  <path d="M190 128 H232" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M380 128 H422" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M570 128 H612" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- motors -->
  <rect x="560" y="220" width="170" height="70" rx="10" fill="#1c1917" stroke="#44403c"/>
  <text x="645" y="250" text-anchor="middle" fill="#e7e5e4" font-family="ui-monospace, monospace" font-size="13">Motors + encoders</text>
  <text x="645" y="270" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="11">differential drive</text>
  <path d="M675 156 V212" stroke="#57534e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- telemetry off critical path -->
  <rect x="70" y="300" width="200" height="70" rx="10" fill="#1c1917" stroke="#44403c" stroke-dasharray="4 3"/>
  <text x="170" y="330" text-anchor="middle" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="13">Telemetry (50 Hz)</text>
  <text x="170" y="350" text-anchor="middle" fill="#78716c" font-family="ui-monospace, monospace" font-size="11">ring buffer � UART</text>
  <path d="M310 156 V250 H270 V300" stroke="#57534e" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>

  <!-- feedback -->
  <path d="M560 255 H130 V164" stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.7" marker-end="url(#arrowWarm)"/>
  <text x="340" y="245" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="11" opacity="0.85">encoder trim (slow)</text>

  <text x="60" y="430" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12" opacity="0.85">SYSTEM ARCHITECTURE  critical path solid, telemetry dashed</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#57534e"/>
    </marker>
    <marker id="arrowWarm" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
