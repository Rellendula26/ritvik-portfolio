<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
 <rect width="800" height="500" fill="#070707"/>
 <rect x="40" y="40" width="720" height="420" rx="14" fill="#0f0f0f" stroke="#292524"/>

 <!-- floor -->
 <line x1="120" y1="380" x2="680" y2="380" stroke="#44403c" stroke-width="2"/>

 <!-- wheels -->
 <circle cx="280" cy="340" r="40" fill="#1c1917" stroke="#a8a29e" stroke-width="3"/>
 <circle cx="280" cy="340" r="8" fill="#f59e0b"/>
 <circle cx="520" cy="340" r="40" fill="#1c1917" stroke="#a8a29e" stroke-width="3"/>
 <circle cx="520" cy="340" r="8" fill="#f59e0b"/>

 <!-- side plate -->
 <path d="M300 200 L500 200 L540 300 L500 340 L300 340 L260 300 Z" fill="#292524" stroke="#fb923c" stroke-width="2"/>

 <!-- carbon spine -->
 <rect x="310" y="248" width="180" height="14" rx="4" fill="#57534e" stroke="#f59e0b"/>
 <text x="400" y="240" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="11">carbon spine</text>

 <!-- battery -->
 <rect x="340" y="270" width="120" height="50" rx="6" fill="#1c1917" stroke="#fdba74"/>
 <text x="400" y="300" text-anchor="middle" fill="#fdba74" font-family="ui-monospace, monospace" font-size="12">3S pack</text>

 <!-- IMU -->
 <rect x="385" y="210" width="30" height="22" rx="3" fill="#f59e0b"/>
 <text x="400" y="198" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, monospace" font-size="11">IMU</text>

 <!-- CG marker -->
 <circle cx="400" cy="310" r="5" fill="#ef4444"/>
 <text x="420" y="314" fill="#fca5a5" font-family="ui-monospace, monospace" font-size="11">CG</text>

 <!-- axle line -->
 <line x1="240" y1="340" x2="560" y2="340" stroke="#78716c" stroke-dasharray="4 4"/>
 <text x="600" y="344" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="11">axle</text>

 <!-- motor brackets -->
 <rect x="250" y="300" width="30" height="40" rx="3" fill="#78716c"/>
 <rect x="520" y="300" width="30" height="40" rx="3" fill="#78716c"/>
 <text x="160" y="320" fill="#a8a29e" font-family="ui-monospace, monospace" font-size="11">Al bracket</text>

 <text x="60" y="430" fill="#f59e0b" font-family="ui-monospace, monospace" font-size="12" opacity="0.85">CHASSIS v3   pack below axle, IMU on spine</text>
</svg>
